{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Días Contigo</title>
    <link rel="stylesheet" href="{% static 'baul/css/estilos.css' %}">
</head>
<body>
    <header class="header-365">
        <a href="{% url 'inicio' %}" class="btn-volver">← Volver al inicio</a>
        <h1>✨ 365 Días Contigo ✨</h1>
        <p>Haz clic en el día de hoy para descubrir tu nota</p>
    </header>

    <main class="contenedor-calendario">
        <div class="grid-calendario">
            {% for nota in notas %}
                {% if nota.dia <= dia_actual %}
                    <button
                        class="dia-card desbloqueado"
                        onclick="abrirNota('{{ nota.fecha_formateada }}', '{{ nota.texto|escapejs }}')">
                        <span class="num-dia">{{ nota.fecha_formateada }}</span>
                        <span class="icono">💌</span>
                    </button>
                {% else %}
                    <button 
                        class="dia-card bloqueado"
                        onclick="mostrarBloqueado('{{ nota.fecha_formateada }}')">
                        <span class="num-dia">
                            {{ nota.fecha_formateada }}
                            <num class="icono">🔒</num>
                        </span>
                    </button>
                {% endif %}
            {% endfor %}
        </div>
    </main>

    <!-- Ventana Emergente (Modal) -->
    <div id="modalNota"
    class="modal"
    style="display:none; 
        position:fixed; 
        inset:0; width:100%; height:100%;
        background:rgba(0,0,0,0.7); justify-content:center;
        align-items:center; 
        z-index:99999;"
    onclick="cerrarModal(event)">
        <div class="modal-contenido" style="background:#fff; 
            color:#333; padding:30px;
            border-radius:20px; 
            width:85%; 
            max-width:450px;
            box-sizing:border-box; 
            text-align:center;
            position:relative; 
            margin:auto;
            box-shadow:0 10px 25px rgba(0,0,0,.15);">
            <span class="cerrar" onclick="cerrarModalDirecto()">&times;</span>
            <h2 id="modalTitulo">Día X</h2>
            <div class="modal-body">
                <p id="modalTexto"></p>
            </div>
            <button class="btn-cerrar-modal" onclick="cerrarModalDirecto()">Guardar recuerdo 💖</button>
        </div>
    </div>

    <!-- JavaScript para manejar los clics y el modal -->
    <script>
        function abrirNota(dia, texto) {
            document.getElementById('modalTitulo').innerText = '✨ Día ' + dia + ' ✨';
            document.getElementById('modalTexto').innerText = texto;
            document.getElementById('modalNota').style.display = 'flex';
        }

        function mostrarBloqueado(dia) {
            document.getElementById('modalTitulo').innerText = '🔒 Día ' + dia;
            document.getElementById('modalTexto').innerText = '¡Aún no puedes abrir esta nota! Vuelve cuando sea su día. 😉';
            document.getElementById('modalNota').style.display = 'flex';
        }

        function cerrarModalDirecto() {
            document.getElementById('modalNota').style.display = 'none';
        }

        function cerrarModal(event) {
            if (event.target.id === 'modalNota') {
                cerrarModalDirecto();
            }
        }
    </script>
</body>
</html>
