{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VALE POR: {{ cupon.titulo }} 🎟️</title>
    <link rel="stylesheet" href="{% static 'baul/css/estilos.css' %}">
</head>
<body>
    <div class="detalle-box" style="border: 3px dashed #f4a261;">
        <button onclick="window.close();" class="btn-volver-atras">← Volver atrás</button>
        
        <h1>VALE POR: {{ cupon.titulo }}</h1>
        
        <div class="detalle-texto">
            {{ cupon.descripcion }}
        </div>

        {% if cupon.canjeado %}
            <p style="color: gray; font-weight: bold;">❌ Este cupón ya ha sido canjeado</p>
        {% else %}
            <form action="{% url 'canjear_cupon' cupon.pk %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="btn-canjear">
                    Canjear Cupón
                </button>
            </form>
        {% endif %}
    </div>
</body>
</html>
